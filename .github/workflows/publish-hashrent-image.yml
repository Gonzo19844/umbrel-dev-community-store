name: Publish HASHRENT container
on:
  push:
    tags:
      - "hashrent-v*"
permissions:
  contents: read
  packages: write
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set lowercase owner
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./willitmod-dev-hashrent-marketplace
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/hashrent:0.1.0
            ghcr.io/${{ steps.owner.outputs.name }}/hashrent:latest
