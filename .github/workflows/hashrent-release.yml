name: HASHRENT container release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "HASHRENT release version (for example 0.5.0)"
        required: true
        default: "0.5.0"
        type: string
  push:
    tags:
      - "hashrent-v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: hashrent-ghcr-release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/gonzo19844/hashrent

jobs:
  publish:
    name: Build and publish HASHRENT image
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Determine release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            VERSION="${GITHUB_REF_NAME#hashrent-v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Invalid release version: ${VERSION}" >&2
            exit 1
          fi
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${IMAGE_NAME}:${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push versioned image and latest
        uses: docker/build-push-action@v6
        with:
          context: ./willitmod-dev-hashrent-marketplace
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.value }}
            ${{ env.IMAGE_NAME }}:latest
