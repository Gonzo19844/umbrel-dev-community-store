<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HASHRENT Admin</title><link rel="stylesheet" href="/styles.css"></head><body><header class="topbar"><a class="brand" href="/"><span class="mark">H</span> HASHRENT</a><a class="topnav" href="/">← Shop</a></header><main class="settings-wrap"><section class="settings-card"><div class="eyebrow">GESCHÜTZTER BEREICH</div><h1>HASHRENT Admin</h1><div id="auth-panel"><div id="auth-message" class="notice">Admin-Status wird geprüft …</div><form id="auth-form"><label id="password-label">Admin-Passwort<input id="admin-password" type="password" minlength="14" required autocomplete="current-password"></label><button class="primary" id="auth-submit">Anmelden</button></form></div><div id="admin-panel" hidden><div class="section-head"><h2>System & Anbieter</h2><button class="secondary" id="logout">Abmelden</button></div><form id="config-form"><h3>MiningRigRentals – interner Einkauf</h3><label>MRR API-Key<input id="mrr-key" type="password" autocomplete="off" placeholder="Neuen Key eingeben, leer = unverändert"></label><label>MRR API-Secret<input id="mrr-secret" type="password" autocomplete="off" placeholder="Neues Secret eingeben, leer = unverändert"></label><label>Standard SHA-256-ASICBoost Pool-Profil<select id="profile-id"><option value="">Profil auswählen …</option></select></label><h3>NOWPayments</h3><label>NOWPayments API-Key<input id="np-key" type="password" autocomplete="off" placeholder="API-Key eingeben"></label><label>NOWPayments IPN Secret<input id="np-secret" type="password" autocomplete="off" placeholder="IPN Secret eingeben"></label><label>Öffentliche HTTPS-Basisadresse<input id="public-url" type="url" placeholder="https://hashrent.example.com" required></label><button class="primary" type="submit">Einstellungen verschlüsselt speichern</button></form><div id="config-message" class="notice compact"></div><hr><h2>Eigene HASHRENT-Angebote</h2><form id="offer-form"><input id="offer-id" type="hidden"><label>Angebotsname<input id="offer-name" maxlength="64" required placeholder="z. B. HASHRENT Pro"></label><label>Beschreibung<input id="offer-description" maxlength="300" placeholder="Beschreibung für Kunden"></label><div class="rules"><label>Min. PH/s<input id="offer-minph" type="number" min="1" max="100" step=".1" value="1" required></label><label>Max. PH/s<input id="offer-maxph" type="number" min="1" max="100" step=".1" value="10" required></label><label>Min. Stunden<input id="offer-minhours" type="number" min="3" max="720" value="3" required></label><label>Max. Stunden<input id="offer-maxhours" type="number" min="3" max="720" value="168" required></label></div><label><input id="offer-enabled" type="checkbox" checked> Öffentlich sichtbar</label><button class="primary" type="submit">Angebot speichern</button><button class="secondary" type="button" id="offer-reset">Neues Angebot</button></form><div id="offer-message" class="notice compact"></div><div id="admin-offers" class="rentals-list"></div><hr><h2>Bestellungen & Marge (intern)</h2><button class="secondary" id="refresh-orders">Aktualisieren</button><div id="admin-orders" class="rentals-list"></div></div></section></main><script src="/admin.js"></script></body></html>
