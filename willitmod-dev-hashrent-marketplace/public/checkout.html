<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d18"><title>HASHRENT – Persönlicher Checkout</title><link rel="stylesheet" href="/styles.css"></head><body><header class="topbar"><a class="brand" href="/"><span class="mark">H</span> HASHRENT</a></header><main class="settings-wrap"><section class="settings-card"><div class="eyebrow">PERSÖNLICHER CHECKOUT</div><h1>Deine Bestellung</h1><p class="muted">Dieser persönliche Checkout-Link gehört zu genau dieser Bestellung.</p><form id="order-form"><label>HASHRENT-Angebot<input id="offer-name" type="text" readonly></label><label>Gewünschte Hashrate (PH/s)<input id="target-ph" type="number" step="0.005" required></label><label>Mietdauer (Stunden)<input id="hours" type="number" step="1" required></label><label>Pool-Server / Host<input id="pool-host" type="text" required maxlength="253" placeholder="stratum.examplepool.com"></label><label>Pool-Port<input id="pool-port" type="number" min="1" max="65535" required placeholder="3333"></label><label>Workername / Wallet-Adresse<input id="pool-user" type="text" required maxlength="200"></label><label>Pool-Passwort<input id="pool-pass" type="password" maxlength="100" value="x" autocomplete="off"></label><p class="small muted">Deine Pooldaten werden verschlüsselt gespeichert und vertraulich verarbeitet.</p><label>Zahlungswährung<select id="currency"><option value="btc">Bitcoin (BTC)</option><option value="ltc">Litecoin (LTC)</option><option value="doge">Dogecoin (DOGE)</option><option value="bch">Bitcoin Cash (BCH)</option></select></label><button class="primary full" type="submit" id="checkout-button">Krypto-Rechnung erstellen</button></form><div id="checkout-message" class="notice compact">Bestelldaten eingeben, um fortzufahren.</div><div id="invoice-result" hidden><p>Deine Rechnung ist bereit.</p><a class="primary" id="invoice-link" href="#" target="_blank" rel="noopener">Jetzt bezahlen ↗</a><p class="small muted" id="order-reference"></p></div></section></main><script src="/checkout.js"></script></body></html>
