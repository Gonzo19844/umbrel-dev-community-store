version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: willitmod-dev-hashrent-marketplace_server_1
      APP_PORT: 3000
  server:
    image: ghcr.io/gonzo19844/hashrent:0.1.0
    init: true
    restart: on-failure
    stop_grace_period: 30s
    environment:
      PORT: "3000"
      DATA_DIR: /app/data
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
