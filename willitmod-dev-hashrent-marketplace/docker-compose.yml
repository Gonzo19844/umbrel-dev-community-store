version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: willitmod-dev-hashrent-marketplace_server_1
      APP_PORT: 3000
  data_permissions:
    image: busybox:1.36.1
    user: "0:0"
    restart: "no"
    command:
      - sh
      - -c
      - mkdir -p /data && chown -R 1000:1000 /data && chmod 770 /data
    volumes:
      - ${APP_DATA_DIR}/data:/data
  server:
    image: ghcr.io/gonzo19844/hashrent:0.5.5
    init: true
    restart: on-failure
    stop_grace_period: 30s
    depends_on:
      data_permissions:
        condition: service_completed_successfully
    environment:
      PORT: "3000"
      DATA_DIR: /app/data
      MRR_API_BASE: https://www.miningrigrentals.com/api/v2
      MRR_API_KEY: ${MRR_API_KEY:-}
      MRR_API_SECRET: ${MRR_API_SECRET:-}
      MARKET_CACHE_MS: "60000"
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
